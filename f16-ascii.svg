<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="Animated F-16 ASCII art">
<style>
  .a{fill:#57606a;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
  .hud{fill:#57606a;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1px}
  @media(prefers-color-scheme:dark){.a,.hud{fill:#c9d1d9}}
</style>
<defs>
  <clipPath id="reveal"><rect x="0" y="0" width="0" height="500"><animate attributeName="width" from="0" to="900" dur="4s" fill="freeze"/></rect></clipPath>
